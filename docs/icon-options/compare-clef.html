<!doctype html>
<html><head><meta charset="utf-8"><title>Ninth Sense clef ear</title>
<style>
  body { margin:0; font-family: system-ui, sans-serif; background:#0b0c18; color:#f4f1ff; }
  h2 { margin:0; padding:18px 16px 6px; font-size:18px; }
  .band { padding:12px 16px 24px; display:flex; gap:12px; flex-wrap:wrap; }
  .band.light { background:#f2f2f6; color:#222; }
  .col { display:flex; flex-direction:column; align-items:center; gap:10px; width:180px; }
  .col .sm { display:flex; gap:14px; align-items:flex-end; }
  .col span { font-size:13px; opacity:.8; }
  img { display:block; border-radius:22%; }
  .phones { display:flex; gap:12px; flex-wrap:wrap; padding:12px 16px 30px; }
  .phone { box-sizing:border-box; width:180px; padding:26px 12px 22px; border-radius:26px;
           background:linear-gradient(160deg,#3a5b8c,#7a4f8f 60%,#c27a6a); display:grid;
           grid-template-columns:repeat(3,48px); justify-content:space-between; gap:16px 0; }
  .tile { width:48px; height:48px; border-radius:12px; background:#cfd3dc; opacity:.85; }
  .app { display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10px; color:#fff;
         text-shadow:0 1px 2px rgba(0,0,0,.6); width:48px; text-align:center; white-space:nowrap; font-size:9px; }
  .app img { width:48px; height:48px; }
  .app .tile + div, .app img + div { min-height:12px; }
</style></head>
<body>
<h2>On dark</h2><div class="band" id="dark"></div>
<h2 style="background:#f2f2f6;color:#222;margin:0">On light</h2><div class="band light" id="light"></div>
<h2>Home screen (48px)</h2><div class="phones" id="phones"></div>
<script>
const opts = ['option-1','clef-a','clef-b','clef-c','clef-d','clef-e','clef-f'];
for (const id of ['dark','light']) {
  document.getElementById(id).innerHTML = opts.map(o => `
    <div class="col"><img src="${o}.svg" width="180" height="180">
      <div class="sm"><img src="${o}.svg" width="96" height="96"><img src="${o}.svg" width="48" height="48"></div>
      <span>${o}</span></div>`).join('');
}
document.getElementById('phones').innerHTML = opts.map(o => {
  const cells = [];
  for (let i = 0; i < 9; i++) {
    if (i === 4) cells.push(`<div class="app"><img src="${o}.svg"><div>Ninth Sense</div></div>`);
    else cells.push(`<div class="app"><div class="tile"></div><div>App</div></div>`);
  }
  return `<div><div class="phone">${cells.join('')}</div><div style="text-align:center;font-size:13px;opacity:.8;margin-top:6px">${o}</div></div>`;
}).join('');
</script>
</body></html>
