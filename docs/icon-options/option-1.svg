<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Ninth Sense - Listening Ear</title>
  <defs>
    <radialGradient id="bg" cx="0.6" cy="0.2" r="1">
      <stop offset="0" stop-color="#1E4E6E"/>
      <stop offset="0.55" stop-color="#16183A"/>
      <stop offset="1" stop-color="#0F1020"/>
    </radialGradient>
    <linearGradient id="ear" gradientUnits="userSpaceOnUse" x1="220" y1="90" x2="380" y2="430">
      <stop offset="0" stop-color="#FFF1B8"/>
      <stop offset="0.45" stop-color="#FFC94D"/>
      <stop offset="1" stop-color="#FF8A5C"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5CE1E6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#5CF2B5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC94D" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFC94D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="310" cy="250" r="180" fill="url(#glow)"/>
  <!-- sound wave travelling into the ear -->
  <path d="M 70 286 Q 98 222 126 286 T 182 286 T 230 286" fill="none" stroke="url(#wave)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ear: helix that doubles as a 9 -->
  <path d="M 226 206 C 226 132 274 96 318 96 C 380 96 420 146 420 208 C 420 266 388 290 368 320 C 348 350 358 404 304 418 C 266 428 242 404 236 378"
        fill="none" stroke="url(#ear)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- inner fold -->
  <path d="M 300 262 C 284 214 298 180 326 180 C 352 180 360 212 346 236" fill="none" stroke="url(#ear)" stroke-width="32" stroke-linecap="round"/>
  <circle cx="292" cy="286" r="28" fill="#FF6FB1"/>
  <circle cx="284" cy="277" r="8" fill="#FFFFFF" opacity="0.75"/>
</svg>
