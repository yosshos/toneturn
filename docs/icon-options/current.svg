<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Ninth Sense</title>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0" r="1.1">
      <stop offset="0" stop-color="#3B2F96"/>
      <stop offset="0.55" stop-color="#16173A"/>
      <stop offset="1" stop-color="#0F1020"/>
    </radialGradient>
    <linearGradient id="nine" gradientUnits="userSpaceOnUse" x1="220" y1="100" x2="420" y2="420">
      <stop offset="0" stop-color="#9DF9D4"/>
      <stop offset="0.45" stop-color="#5CF2B5"/>
      <stop offset="1" stop-color="#3FC7E0"/>
    </linearGradient>
    <radialGradient id="gold" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFF1B8"/>
      <stop offset="0.5" stop-color="#FFC94D"/>
      <stop offset="1" stop-color="#F08A2C"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5CF2B5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5CF2B5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8FC4"/><stop offset="1" stop-color="#FF6FB1"/></linearGradient>
    <linearGradient id="arc2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C59BFF"/><stop offset="1" stop-color="#8E6BFF"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="4"/>
  <g transform="translate(-16 4)">
  <circle cx="296" cy="206" r="170" fill="url(#glow)"/>
  <!-- sound arriving: the sense -->
  <path d="M 128 132 A 150 150 0 0 0 128 280" fill="none" stroke="url(#arc2)" stroke-width="24" stroke-linecap="round" opacity="0.7" transform="translate(-34 0)"/>
  <path d="M 150 158 A 100 100 0 0 0 150 254" fill="none" stroke="url(#arc1)" stroke-width="24" stroke-linecap="round"/>
  <!-- the 9: a ring whose stem ends in a note head -->
  <circle cx="296" cy="206" r="90" fill="none" stroke="url(#nine)" stroke-width="62"/>
  <path d="M 386 206 V 392" fill="none" stroke="url(#nine)" stroke-width="62" stroke-linecap="round"/>
  <ellipse cx="342" cy="410" rx="64" ry="46" transform="rotate(-24 342 410)" fill="url(#gold)"/><ellipse cx="322" cy="396" rx="18" ry="9" transform="rotate(-24 322 396)" fill="#FFFFFF" opacity="0.55"/>
  <!-- the eye of the 9 -->
  <circle cx="296" cy="206" r="30" fill="url(#gold)"/>
  <circle cx="286" cy="196" r="9" fill="#FFFFFF" opacity="0.75"/>
  <!-- spark -->
  <path d="M 432 82 l 9 25 25 9 -25 9 -9 25 -9 -25 -25 -9 25 -9 z" fill="#FFC94D"/>
  </g>
</svg>
