<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Ninth Sense - Musical Eye</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B1F66"/>
      <stop offset="1" stop-color="#0F1020"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C59BFF"/>
      <stop offset="1" stop-color="#FF6FB1"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#B8FFE4"/>
      <stop offset="0.55" stop-color="#5CF2B5"/>
      <stop offset="1" stop-color="#1FA3B8"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF6FB1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF6FB1" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="eye"><path d="M 84 264 Q 256 92 428 264 Q 256 436 84 264 Z"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="256" cy="264" r="210" fill="url(#glow)"/>
  <!-- sensing rays -->
  <g stroke="#FFC94D" stroke-width="26" stroke-linecap="round">
    <path d="M 256 96 V 128"/>
    <path d="M 160 120 L 176 148"/>
    <path d="M 352 120 L 336 148"/>
  </g>
  <!-- eye -->
  <path d="M 84 264 Q 256 92 428 264 Q 256 436 84 264 Z" fill="#0F1020"/>
  <g clip-path="url(#eye)">
    <circle cx="256" cy="264" r="86" fill="url(#iris)"/>
    <circle cx="256" cy="264" r="44" fill="#0F1020"/>
    <!-- note inside the pupil -->
    <ellipse cx="248" cy="286" rx="17" ry="12" transform="rotate(-24 248 286)" fill="#FFC94D"/>
    <path d="M 262 284 V 240 Q 276 246 280 258" fill="none" stroke="#FFC94D" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="226" cy="232" r="14" fill="#FFFFFF" opacity="0.85"/>
  </g>
  <path d="M 84 264 Q 256 92 428 264 Q 256 436 84 264 Z" fill="none" stroke="url(#lid)" stroke-width="30" stroke-linejoin="round"/>
</svg>
