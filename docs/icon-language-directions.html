<style>

:root[data-theme="dark"] { --paper: #140a24; --ink: #f4efff; --card: #241540; --card2: #2e1a4f; --soft: #b9a8de; --line: #3d2a62; --bar: #07030f; --bar-ink: #f4efff; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 10px; background: var(--paper); border-bottom: 2px solid var(--line);

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }

.btn.pr { background: var(--purple); color: #fff; border-color: var(--purple); }

h2 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0; text-wrap: balance; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; }

.tile svg { width: 72px; height: 72px; }

.row2 { display: grid; grid-template-columns: 1.1fr 1fr; gap: 14px; }

.panel { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel h3 { margin: 0; font-size: 15px; }
.sizes { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }

.node svg { width: 46px; height: 46px; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mini { border: 2px solid var(--ink); border-radius: 16px; padding: 10px; display: flex; gap: 10px; align-items: center; min-width: 0; }

.intro { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

.dir { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }

// ---------------------------------------------------------------- the three treatments
const attrs = (o) => Object.entries(o).map(([k, v]) => `${k}="${v}"`).join(' ');
const el = (p, extra) => `<${p.t} ${attrs({ ...p.a, ...extra })}/>`;
const SOLID = new Set(['body', 'accent', 'light', 'ink']);

/** A — "חרוט": ink outline + flat fill + the app's offset shadow (a sticker in the cards' language). */
function styleA(ic, ink, paper) {
  const fill = (r) => r === 'body' ? ic.hue : r === 'accent' ? ic.hue2 : r === 'light' ? paper : ink;
  let sh = '', s = '';
  for (const p of ic.parts) {
    if (SOLID.has(p.role)) sh += el(p, { fill: ink, stroke: ink, 'stroke-width': 2.2, 'stroke-linejoin': 'round' });
    if (p.role === 'tube') sh += el(p, { fill: 'none', stroke: ink, 'stroke-width': p.w + 4.4, 'stroke-linecap': 'round' });
  }
  for (const p of ic.parts) {
    if (SOLID.has(p.role)) s += el(p, { fill: fill(p.role), stroke: ink, 'stroke-width': 2.2, 'stroke-linejoin': 'round' });
    else if (p.role === 'tube') s += el(p, { fill: 'none', stroke: ink, 'stroke-width': p.w + 4.4, 'stroke-linecap': 'round' }) + el(p, { fill: 'none', stroke: ic.hue, 'stroke-width': p.w, 'stroke-linecap': 'round' });
    else if (p.role === 'dash') s += el(p, { fill: 'none', stroke: paper, 'stroke-width': p.w, 'stroke-dasharray': '2.6 3', 'stroke-linecap': 'round' });
    else if (p.role === 'accentline') s += el(p, { fill: 'none', stroke: ink, 'stroke-width': (p.w || 2) + 2.6, 'stroke-linecap': 'round' }) + el(p, { fill: 'none', stroke: ic.hue2, 'stroke-width': p.w || 2, 'stroke-linecap': 'round' });
    else s += el(p, { fill: 'none', stroke: ink, 'stroke-width': p.w || 1.4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
  }
  return `<g transform="translate(-2.2 2.2)">${sh}</g>${s}`;
}
/** B — "נייר": no outlines; each shape is a sheet with a darker edge under it, tones of one hue. */
function styleB(ic, ink, paper) {
  const deep = mix(ic.hue, C.ink, 0.45), lite = mix(ic.hue, '#ffffff', 0.78), acc = ic.hue2;
  const fill = (r) => r === 'body' ? ic.hue : r === 'accent' ? acc : r === 'light' ? lite : deep;
  const edge = (r) => r === 'body' ? mix(ic.hue, C.ink, 0.3) : r === 'accent' ? mix(acc, C.ink, 0.3) : r === 'light' ? mix(ic.hue, '#ffffff', 0.45) : mix(deep, C.ink, 0.4);
  let s = '';
  for (const p of ic.parts) {
    if (SOLID.has(p.role)) s += `<g transform="translate(0 1.9)">${el(p, { fill: edge(p.role) })}</g>` + el(p, { fill: fill(p.role) });
    else if (p.role === 'tube') s += `<g transform="translate(0 1.9)">${el(p, { fill: 'none', stroke: mix(ic.hue, C.ink, 0.3), 'stroke-width': p.w, 'stroke-linecap': 'round' })}</g>` + el(p, { fill: 'none', stroke: ic.hue, 'stroke-width': p.w, 'stroke-linecap': 'round' });
    else if (p.role === 'dash') s += el(p, { fill: 'none', stroke: lite, 'stroke-width': p.w, 'stroke-dasharray': '2.6 3', 'stroke-linecap': 'round' });
    else if (p.role === 'accentline') s += el(p, { fill: 'none', stroke: acc, 'stroke-width': (p.w || 2) + 0.6, 'stroke-linecap': 'round' });
    else s += el(p, { fill: 'none', stroke: deep, 'stroke-width': (p.w || 1.4) + 0.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
  }
  return s;
}
/** C — "פוסטר": ink silhouettes on a colour disc, accents in halftone dots — a gig-poster / engraving feel. */
let PAT = 0;
function styleC(ic, ink, paper) {
  const id = 'ht' + (++PAT);
  const defs = `<defs><pattern id="${id}" width="2.6" height="2.6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="2.6" height="2.6" fill="${ic.hue2}"/><circle cx="1.3" cy="1.3" r="0.62" fill="${ink}" opacity=".55"/></pattern></defs>`;
  const fill = (r) => r === 'body' ? ink : r === 'accent' ? `url(#${id})` : r === 'light' ? paper : ink;
  let s = `<circle cx="27" cy="27" r="20.5" fill="${ic.hue}"/>`;
  for (const p of ic.parts) {
    if (SOLID.has(p.role)) s += el(p, { fill: fill(p.role), stroke: ink, 'stroke-width': p.role === 'light' ? 1.6 : 1, 'stroke-linejoin': 'round' });
    else if (p.role === 'tube') s += el(p, { fill: 'none', stroke: ink, 'stroke-width': p.w + 1, 'stroke-linecap': 'round' });
    else if (p.role === 'dash') s += el(p, { fill: 'none', stroke: ic.hue, 'stroke-width': p.w + 0.4, 'stroke-dasharray': '2.6 3', 'stroke-linecap': 'round' });
    else if (p.role === 'accentline') s += el(p, { fill: 'none', stroke: ink, 'stroke-width': (p.w || 2) + 0.8, 'stroke-linecap': 'round' });
    else if (p.role === 'line') s += el(p, { fill: 'none', stroke: ic.hue, 'stroke-width': (p.w || 1.4) + 0.3, 'stroke-linecap': 'round' });
    else s += el(p, { fill: 'none', stroke: ic.id === 'theory' || ic.id === 'keys' ? ink : paper, 'stroke-width': p.w || 1.4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
  }
  return defs + s;
}

const DIRS = [
  { key: 'a', name: 'חרוט', sub: 'קו דיו, מילוי שטוח וצל מוזח', f: styleA,
    desc: 'אותה שפה של הכרטיסים והכפתורים באפליקציה: קו דיו עבה, צבע שטוח אחד או שניים, וצל מוזח שמרים כל אייקון כמו מדבקה. ראש התו הנטוי חוזר בכל אייקון. הכי קרוב לזהות הקיימת, והכי קריא בגדלים קטנים.' },
  { key: 'b', name: 'נייר', sub: 'שכבות בלי קווים, גוונים של צבע אחד', f: styleB,
    desc: 'בלי קווי מתאר: כל צורה היא גיליון צבעוני עם שוליים כהים מתחתיו, כמו נייר חתוך. גוונים של צבע אחד לכל אייקון, ופרטים בגוון הכהה. רך, מודרני ובוגר, פחות "משחקי".' },
  { key: 'c', name: 'פוסטר', sub: 'צללית דיו על עיגול צבע, נקודות רסטר', f: styleC,
    desc: 'צלליות דיו מלאות על עיגול צבע, והדגשות בנקודות רסטר כמו בפוסטרים של הופעות ג׳אז ובחריטה של תווים. הכי ייחודי ואופי מוזיקלי חזק, אבל דורש גרסה פשוטה יותר לגדלים קטנים.' },
];

const svg = (dir, ic, ink = C.ink, paper = C.paper) => `<svg viewBox="-3 -1 54 52" role="img" aria-label="${ic.he}">${dir.f(ic, ink, paper)}</svg>`;
const by = (id) => ICONS.find((i) => i.id === id);

// ---------------------------------------------------------------- slides
const slides = [];
slides.push({ title: 'שלושה כיוונים', html: `
  <h2>שלושה כיוונים לשפת האייקונים</h2>
  <p class="lead">אותם 16 אייקונים, מצוירים בשלוש שפות שונות. כל שפה בנויה על אותם כללים: גריד של 48, ראש התו הנטוי ב־20 מעלות כמוטיב חוזר, צבעי האפליקציה, ושכבות של גוף, הדגשה ופרטים במקום קו דק אחד. בכל שקף רואים את השפה בגדלים שונים ובתוך מסכים אמיתיים.</p>
  <div class="rules"><span>גריד 48</span><span>ראש תו נטוי כמוטיב</span><span>צבעי האפליקציה</span><span>שלוש רמות פירוט: 16 / 24 / 48+</span><span>בהיר וכהה</span></div>
  <div class="intro">${DIRS.map((d) => `<div class="dir"><div class="ic">${['keys', 'voice', 'encore'].map((id) => svg(d, by(id))).join('')}</div><h3>${d.name}</h3><p>${d.desc}</p></div>`).join('')}</div>` });

for (const d of DIRS) slides.push({ title: d.name, html: `
  <h2>${d.name}</h2>
  <p class="lead">${d.desc}</p>
  <div class="grid">${ICONS.map((ic) => `<div class="tile">${svg(d, ic)}<b>${ic.he}</b></div>`).join('')}</div>
  <div class="row2">
    <div class="panel"><h3>בתוך האפליקציה</h3>
      <div class="nav">${[['path', 'מסלול'], ['practice', 'תרגול', 1], ['games', 'משחקים'], ['recordings', 'הקלטות'], ['profile', 'פרופיל']].map(([id, t, on]) => `<div class="${on ? 'on' : ''}">${svg(d, by(id), on ? C.ink : '#fbf7ff', on ? C.paper : '#2e1a4f')}<span>${t}</span></div>`).join('')}</div>
      <div class="pathc"><div class="node done">${svg(d, by('ear'))}</div><div class="node now">${svg(d, by('keys'))}</div><div class="node">${svg(d, by('theory'))}</div><div class="node">${svg(d, by('jazz'))}</div></div>
      <div class="cards">
        <div class="mini m1">${svg(d, by('encore'))}<div><div class="t">הדרן</div><div class="s">2 משפטים לחזרה</div></div></div>
        <div class="mini m2">${svg(d, by('ear'))}<div><div class="t">שמיעה</div><div class="s">מרווחים · רמה 6</div></div></div>
        <div class="mini m3">${svg(d, by('voice'))}<div><div class="t">שירה</div><div class="s">ביצוע אחרון 92%</div></div></div>
        <div class="mini m4">${svg(d, by('streak'))}<div><div class="t">רצף</div><div class="s">14 ימים</div></div></div>
      </div></div>
    <div class="panel"><h3>גדלים</h3>
      ${['guitar', 'drums', 'recordings'].map((id) => `<div class="sizes">${[24, 36, 56, 96].map((s) => `<figure><div style="width:${s}px;height:${s}px">${svg(d, by(id))}</div><figcaption>${s}px</figcaption></figure>`).join('')}</div>`).join('')}
      <p class="note">ב־16 ו־24 פיקסלים אצייר גרסה מופשטת של כל אייקון, עם פחות פרטים, כדי שיישאר חד.</p></div>
  </div>` });

slides.push({ title: 'השוואה', html: `
  <h2>השוואה</h2>
  <p class="lead">אותם אייקונים זה ליד זה. אפשר גם לשלב: למשל "חרוט" בממשק ובניווט, ו"פוסטר" לתגים, להישגים ולצמתים מיוחדים במסלול.</p>
  <div class="cmp"><span></span>${DIRS.map((d) => `<span class="h">${d.name}</span>`).join('')}
  ${['path', 'keys', 'guitar', 'voice', 'jazz', 'encore', 'streak', 'settings'].map((id) => `<span class="lab">${by(id).he}</span>${DIRS.map((d) => `<div class="c">${svg(d, by(id))}</div>`).join('')}`).join('')}</div>` });

// ---------------------------------------------------------------- viewer
const deck = document.getElementById('deck');
deck.innerHTML = slides.map((s, i) => `<section class="slide" data-i="${i}" ${i ? 'hidden' : ''}>${s.html}</section>`).join('');
const els = [...deck.querySelectorAll('.slide')];
let cur = 0;
const show = (i) => { cur = (i + els.length) % els.length; els.forEach((e, j) => (e.hidden = j !== cur)); document.getElementById('cnt').textContent = `${cur + 1} / ${els.length} · ${slides[cur].title}`; try { history.replaceState(null, '', '#s' + cur); } catch (e) {} window.scrollTo(0, 0); };
document.getElementById('next').onclick = () => show(cur + 1);
document.getElementById('prev').onclick = () => show(cur - 1);
addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft' || e.key === ' ') { e.preventDefault(); show(cur + 1); } else if (e.key === 'ArrowRight') { e.preventDefault(); show(cur - 1); } });
document.getElementById('theme').onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; };
const fromHash = () => { const m = /^#s(\d+)$/.exec(location.hash); return m ? +m[1] : 0; };
addEventListener('hashchange', () => { const i = fromHash(); if (i !== cur) show(i); });
show(fromHash());
})();
</script>
