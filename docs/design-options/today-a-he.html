<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Today — Calm night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page);}
body{width:390px;height:844px;overflow:hidden;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.phone{position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.ic{width:20px;height:20px;flex:none;display:block}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 32px;font-size:15px;font-weight:600;color:var(--ink);direction:ltr;letter-spacing:-.01em}
.status .sys{display:flex;gap:6px;align-items:center}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 20px}
[dir=rtl] .top{padding:0 20px 0 16px}
.brand{display:flex;align-items:center;gap:10px}
.logo{display:block;flex:none}
.word{font-family:var(--word-font,var(--font));font-weight:var(--word-w,600);font-size:var(--word-size,18px);letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
.word sup{font-size:.55em;vertical-align:.75em;line-height:0;margin-inline-start:.04em;letter-spacing:0}
.actions{display:flex;align-items:center;gap:4px}
.streak{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 11px 0 8px;border-radius:999px;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;margin-inline-end:4px}
[dir=rtl] .streak{padding:0 8px 0 11px}
.streak .ic{width:18px;height:18px}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--ink-2);position:relative}
.iconbtn.sm{width:36px;height:36px;border-radius:10px}
.iconbtn.sm .ic{width:18px;height:18px}
.gift .dot{position:absolute;top:9px;inset-inline-end:9px;width:7px;height:7px;border-radius:50%;background:var(--pop);box-shadow:0 0 0 2px var(--bg)}
main{flex:1;padding:8px 20px 0;display:flex;flex-direction:column;gap:var(--gap,18px)}
.resume{display:flex;align-items:center;gap:12px;padding:12px 10px 12px 14px}
[dir=rtl] .resume{padding:12px 14px 12px 10px}
.rr-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.rr-text{flex:1;min-width:0}
.rr-title{font-size:15px;font-weight:600;line-height:20px}
.rr-meta{display:flex;align-items:center;gap:10px;margin-top:6px}
.bar{flex:1;height:4px;border-radius:4px;background:var(--track);overflow:hidden;display:block}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.rr-count{font-size:12px;font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
.resume .iconbtn.solid{color:var(--on-accent);background:var(--accent)}
.resume .iconbtn.solid .ic{width:16px;height:16px}
.wk-head{display:flex;align-items:center;justify-content:space-between}
.kicker{font-size:13px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.kicker .sep{color:var(--ink-3)}
.wk-title{font-family:var(--head-font,var(--font));font-weight:var(--head-w,600);font-size:var(--head-size,26px);line-height:1.15;letter-spacing:var(--head-ls,-.02em);margin-top:4px}
.wk-title .sub{display:block;font-family:var(--font);font-size:15px;font-weight:500;letter-spacing:0;color:var(--ink-2);margin-top:6px}
.blocks{list-style:none;margin-top:18px}
.blk{display:flex;align-items:center;gap:12px;height:54px;padding:0 12px;font-size:15px;font-weight:500;position:relative}
.num{width:24px;font-size:13px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
.bico{color:var(--ink-3);flex:none}
.bico .ic{width:18px;height:18px}
.bname{flex:1}
.dur{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:22px;text-align:end}
.now{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px 3px 7px;border-radius:999px}
.eq{display:inline-flex;align-items:flex-end;gap:1.5px;height:10px}
.eq i{display:block;width:2px;border-radius:1px;background:currentColor}
.eq i:nth-child(1){height:5px}.eq i:nth-child(2){height:10px}.eq i:nth-child(3){height:7px}.eq i:nth-child(4){height:3px}
.wk-foot{display:flex;align-items:center;gap:16px;margin-top:18px}
.start{flex:1;height:52px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:600;background:var(--accent);color:var(--on-accent);border-radius:var(--btn-r,14px)}
.start .ic{width:16px;height:16px}
.goal{display:flex;flex-direction:column;align-items:center;gap:2px}
.ring{position:relative;width:52px;height:52px}
.ring svg{display:block}
.ring-bg{stroke:var(--track)}
.ring-fg{stroke:var(--ring,var(--accent))}
.ring-num{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-variant-numeric:tabular-nums;line-height:1}
.ring-num b{font-weight:700}
.ring-num small{font-size:10px;color:var(--ink-3);font-weight:500}
.ring-num b{font-size:15px}
.goal-l{font-size:11px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.find{align-self:center;margin:auto 0 28px;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-2)}
.find .ic{width:16px;height:16px}
.tabbar{height:62px;display:flex;align-items:stretch;justify-content:space-around;padding:0 8px;margin-top:auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:var(--ink-3);text-decoration:none;position:relative}
.tab .ic{width:22px;height:22px}
.tab.on{color:var(--tab-on,var(--accent))}
.tab.on span{font-weight:600}
.home-ind{height:22px;position:relative}
.home-ind::after{content:"";position:absolute;left:50%;top:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);opacity:.85}


:root{--page:#0b0f1a;--bg:#0e1322;--surface:#151b2c;--surface-2:#1a2135;--line:rgba(214,224,255,.09);--ink:#e9edf5;--ink-2:#aab3c5;--ink-3:#8590a6;
--accent:#86dcbd;--on-accent:#0b1a16;--track:rgba(214,224,255,.10);--pop:#f2b866;
--font:'Inter','Rubik',system-ui,sans-serif;--head-font:'Inter','Rubik',sans-serif;--head-size:25px;--head-w:600;}
[lang=he]{--font:'Rubik',system-ui,sans-serif;--head-font:'Rubik',sans-serif}
.word{--word-size:17px}
.top{border-bottom:1px solid var(--line)}
main{padding-top:22px}
.streak{color:#f2c27a;background:rgba(242,184,102,.10);box-shadow:inset 0 0 0 1px rgba(242,184,102,.22)}
.streak b{color:var(--ink)}
.resume{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.rr-ico{background:rgba(134,220,189,.10);color:var(--accent)}
.resume .iconbtn.ghost{color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.wk{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 16px 18px}
.wk-head .iconbtn{color:var(--ink-2);margin:-8px -6px -8px 0}
.kicker{text-transform:uppercase;letter-spacing:.07em;font-size:12px}
.kicker .mins{color:var(--accent)}
.blocks{border-top:1px solid var(--line)}
.blk{border-bottom:1px solid var(--line);padding:0 4px}
.blk:last-child{border-bottom:0}
.blk.cur{background:linear-gradient(90deg,rgba(134,220,189,.09),rgba(134,220,189,0));border-radius:0}
[dir=rtl] .blk.cur{background:linear-gradient(270deg,rgba(134,220,189,.09),rgba(134,220,189,0))}
.blk.cur::before{content:"";position:absolute;inset-inline-start:0;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--accent)}
.blk.cur .num,.blk.cur .bico{color:var(--accent)}
.blk .num{padding-inline-start:8px;width:28px}
.now{color:var(--accent);background:rgba(134,220,189,.12)}
.wk-foot{margin-top:16px}
.start{border-radius:12px}
.ring-fg{stroke:var(--accent)}
.find{color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.find .ic{color:var(--accent)}
.tabbar{border-top:1px solid var(--line);background:var(--bg)}
.tab.on::before{content:"";position:absolute;top:-1px;width:24px;height:2px;border-radius:2px;background:var(--accent)}
.home-ind{background:var(--bg)}

</style>
</head>
