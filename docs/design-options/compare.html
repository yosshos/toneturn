<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today screen — three directions</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0 }
  body { width: 1400px; background: #e9e7e2; font-family: 'Inter', system-ui, sans-serif; color: #1a1c21; -webkit-font-smoothing: antialiased }
  .wrap { padding: 56px 64px 60px }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 40px }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em }
  header p { font-size: 15px; color: #5a5e68 }
  .row { display: flex; justify-content: space-between; gap: 40px }
  figure { width: 390px; display: flex; flex-direction: column; align-items: center }
  .shot { width: 390px; height: 844px; border-radius: 44px; overflow: hidden; box-shadow: 0 0 0 10px #16171b, 0 0 0 11px #3a3c42, 0 30px 60px -20px rgba(0,0,0,.45) }
  .shot img { display: block; width: 390px; height: 844px }
  figcaption { margin-top: 36px; text-align: center; max-width: 360px }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #5a5e68; margin-bottom: 6px }
  figcaption b { display: block; font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 6px }
  figcaption span.idea { font-size: 15px; line-height: 1.45; color: #474b55 }
  .sw { display: flex; gap: 6px; justify-content: center; margin-top: 12px }
  .sw i { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12) }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>The 7th Sense — Today screen, three directions</h1><p>Same content · 390 × 844 · line icons, one accent each</p></header>
  <div class="row">
    <figure>
      <div class="shot"><img src="today-a.png" alt="Direction A"></div>
      <figcaption><span class="tag">A</span><b>Calm night</b><span class="idea">The current navy, desaturated: hairline borders, no glow, one soft-mint accent.</span>
        <div class="sw"><i style="background:#0e1322"></i><i style="background:#151b2c"></i><i style="background:#e9edf5"></i><i style="background:#86dcbd"></i><i style="background:#f2b866"></i></div></figcaption>
    </figure>
    <figure>
      <div class="shot"><img src="today-b.png" alt="Direction B"></div>
      <figcaption><span class="tag">B</span><b>Studio</b><span class="idea">Warm graphite and brass like studio gear, with an editorial serif heading and a tracklist.</span>
        <div class="sw"><i style="background:#181614"></i><i style="background:#211e1b"></i><i style="background:#f3ede4"></i><i style="background:#e0aa52"></i></div></figcaption>
    </figure>
    <figure>
      <div class="shot"><img src="today-c.png" alt="Direction C"></div>
      <figcaption><span class="tag">C</span><b>Paper</b><span class="idea">A light study theme: off-white paper, ink text and deep indigo, clear for daytime practice.</span>
        <div class="sw"><i style="background:#f7f5f0"></i><i style="background:#ffffff"></i><i style="background:#16181d"></i><i style="background:#3a43c4"></i><i style="background:#ef6a4c"></i></div></figcaption>
    </figure>
  </div>
</div>
</body>
</html>
