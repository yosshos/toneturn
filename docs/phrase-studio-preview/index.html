<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encore screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=Secular+One&family=Noto+Music&display=swap" rel="stylesheet">
<style>
/* v2 tokens (src/v2.css) */
:root{
  --paper:#fbf7ff;--ink-c:#1e1033;--purple:#6d28d9;--lilac:#a78bfa;--lemon:#ffd43b;--sky:#3ab8ff;--pink:#ff5fa2;--teal:#12c9b4;--tangerine:#ff8a3d;
  --bg:var(--paper);--bg-2:#f3ecff;--card:#ffffff;--card-2:#f6f0ff;--ink:var(--ink-c);--ink-soft:#3b2a5c;--ink-dim:#5b4a86;--outline:var(--ink-c);
  --line:rgba(30,16,51,.12);--line-strong:#c9b8ec;--accent:var(--purple);--accent-ink:#fff;--now:var(--lemon);--ok:var(--teal);--ok-soft:#d9fbf5;--bad:var(--pink);--bad-soft:#ffe1ee;--near:var(--tangerine);
  --sel:rgba(167,139,250,.28);--pending:#b7a9d6;--bezel:#140a24;
  --stroke:2.5px;--sx:-4px;--shadow:var(--sx) 4px 0 var(--outline);--shadow-s:-3px 3px 0 var(--outline);
  --font:'Rubik',system-ui,'Segoe UI',Arial,sans-serif;--display:'Secular One','Rubik',system-ui,sans-serif;--music:'Noto Music','Rubik',serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#140a24;--bg-2:#1e1033;--card:#241540;--card-2:#2e1a4f;--ink:#fff;--ink-soft:#e3d8ff;--ink-dim:#b9a8de;--outline:#07030f;
    --line:rgba(255,255,255,.1);--line-strong:#4a3670;--accent:var(--lilac);--accent-ink:var(--ink-c);--ok-soft:#0e3d39;--bad-soft:#4a1630;
    --sel:rgba(167,139,250,.22);--pending:#5d4a85;--bezel:#000;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#140a24;--bg-2:#1e1033;--card:#241540;--card-2:#2e1a4f;--ink:#fff;--ink-soft:#e3d8ff;--ink-dim:#b9a8de;--outline:#07030f;
  --line:rgba(255,255,255,.1);--line-strong:#4a3670;--accent:var(--lilac);--accent-ink:var(--ink-c);--ok-soft:#0e3d39;--bad-soft:#4a1630;
  --sel:rgba(167,139,250,.22);--pending:#5d4a85;--bezel:#000;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg-2);color:var(--ink);font-family:var(--font);overflow:hidden}
bdi{unicode-bidi:isolate}
.mu{font-family:var(--music);font-weight:400}
.tm{white-space:nowrap}.tm .mu{display:inline-block;font-size:1.05em;margin-right:.12em}

/* viewer chrome */
.bar{position:fixed;inset:0 0 auto 0;height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--bg);border-bottom:var(--stroke) solid var(--outline);z-index:5}
.bar h1{font-family:var(--display);font-weight:400;font-size:20px;margin:0;white-space:nowrap}
.bar .cnt{font-size:13px;color:var(--ink-dim);font-weight:600;white-space:nowrap}
.bar .sp{flex:1}
.vb{height:38px;min-width:38px;padding:0 12px;border:var(--stroke) solid var(--outline);border-radius:12px;background:var(--card);color:var(--ink);font:700 14px var(--font);box-shadow:var(--shadow-s);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.vb:active{transform:translate(-3px,3px);box-shadow:none}
.vb.pr{background:var(--accent);color:var(--accent-ink)}
.vb svg{width:18px;height:18px}
@media (max-width:640px){.bar .cnt{display:none}.bar h1{font-size:16px}.vb .t{display:none}}
.deck{position:fixed;inset:56px 0 0 0;overflow:auto}
.slide{display:none;padding:14px 16px 24px}
.slide.on{display:block}
.cap{max-width:1200px;margin:0 auto 12px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.cap h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.cap p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.5;flex:1;min-width:260px}
.stage{display:flex;gap:28px;justify-content:center;align-items:flex-start}
.fit{position:relative;direction:ltr;flex:none}
.fit>.inner{position:absolute;top:0;left:0;transform-origin:0 0}
.lbl{font-size:12px;color:var(--ink-dim);font-weight:700;text-align:center;margin-top:6px;direction:rtl}
@media (max-width:899px){.stage{flex-direction:column;align-items:center}}

/* device frames */
.phone{width:410px;height:864px;border-radius:54px;background:var(--bezel);padding:10px}
.scr{width:390px;height:844px;border-radius:44px;overflow:hidden;background:var(--bg);color:var(--ink);direction:rtl;position:relative;display:flex;flex-direction:column}
.sb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font:700 15px var(--font);direction:ltr}
.sb i{display:inline-block;width:24px;height:11px;border:2px solid currentColor;border-radius:3px;position:relative}
.sb i:after{content:"";position:absolute;inset:1px 6px 1px 1px;background:currentColor;border-radius:1px}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);opacity:.8}
.wide{width:1284px;height:804px;border-radius:16px;border:var(--stroke) solid var(--outline);background:var(--bg);overflow:hidden;box-shadow:var(--shadow);direction:rtl;display:flex;flex-direction:column}
.wbar{height:34px;flex:none;border-bottom:var(--stroke) solid var(--outline);display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--card-2);direction:ltr}
.wbar b{width:11px;height:11px;border-radius:50%;border:2px solid var(--outline);background:var(--card)}
.wbar span{margin-left:12px;flex:1;max-width:420px;height:22px;border-radius:8px;border:2px solid var(--line-strong);background:var(--card);font:500 12px var(--font);color:var(--ink-dim);display:flex;align-items:center;padding:0 10px}
.wbody{flex:1;display:flex;min-height:0}
.side{width:224px;flex:none;border-inline-start:none;border-inline-end:var(--stroke) solid var(--outline);padding:16px 12px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:19px;margin:0 6px 14px}
.logo svg{width:30px;height:30px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;font-weight:600;font-size:15px;color:var(--ink-soft);border:var(--stroke) solid transparent}
.nav svg{width:20px;height:20px;flex:none}
.nav.on{background:var(--card);border-color:var(--outline);color:var(--ink);box-shadow:var(--shadow-s)}
.nav .n{margin-inline-start:auto;font-size:12px;font-weight:800;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 8px}
.sideh{font-size:11px;font-weight:800;color:var(--ink-dim);margin:12px 10px 4px;letter-spacing:.02em}
.main{flex:1;min-width:0;padding:22px 28px;display:flex;flex-direction:column;gap:16px;overflow:hidden}

/* app pieces */
.hd{height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px}
.hd h3{flex:1;margin:0;font-family:var(--display);font-weight:400;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .sub{font:500 12px var(--font);color:var(--ink-dim);display:block;margin-top:-2px}
.ib{width:38px;height:38px;flex:none;border:var(--stroke) solid var(--outline);border-radius:13px;background:var(--card);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow-s)}
.ib svg{width:19px;height:19px}
.ib.sm{width:32px;height:32px;border-radius:11px}
.ib.sm svg{width:16px;height:16px}
.ib.on{background:var(--accent);color:var(--accent-ink)}
.body{flex:1;min-height:0;padding:4px 16px 26px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.cd{background:var(--card);border:var(--stroke) solid var(--outline);border-radius:20px;box-shadow:var(--shadow);padding:12px 14px}
.cd.flat{box-shadow:none}
.cd.soft{background:var(--card-2)}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
.t1{font-family:var(--display);font-size:20px;line-height:1.15}
.t2{font-weight:700;font-size:15px}
.t3{font-size:13px;color:var(--ink-dim);font-weight:500}
.tiny{font-size:11.5px;color:var(--ink-dim);font-weight:600}
.big{font-family:var(--display);font-size:44px;line-height:1}
.ch{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--outline);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;background:var(--card);white-space:nowrap;color:var(--ink)}
.ch.on{background:var(--accent);color:var(--accent-ink)}
.ch.gh{border-color:var(--line-strong)}
.ch.q{border-style:dashed}
.ch svg{width:14px;height:14px}
.conf{letter-spacing:1px;font-size:10px;color:var(--accent)}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 16px;border:var(--stroke) solid var(--outline);border-radius:14px;background:var(--card);color:var(--ink);font:800 15px var(--font);box-shadow:var(--shadow);white-space:nowrap}
.bt svg{width:18px;height:18px}
.bt.pr{background:var(--accent);color:var(--accent-ink)}
.bt.mg{height:56px;border-radius:16px;background:var(--now);color:var(--ink-c);font-size:17px;font-weight:900}
.bt.gh{background:transparent;border-color:var(--line-strong);box-shadow:none}
.bt.sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:12px;box-shadow:var(--shadow-s)}
.bt.full{width:100%}
.seg{display:flex;border:var(--stroke) solid var(--outline);border-radius:13px;overflow:hidden;background:var(--card)}
.seg span{flex:1;text-align:center;padding:7px 8px;font-size:13.5px;font-weight:700;border-inline-start:2px solid var(--outline)}
.seg span:first-child{border-inline-start:none}
.seg span.on{background:var(--accent);color:var(--accent-ink)}
.tog{width:44px;height:26px;border-radius:999px;border:var(--stroke) solid var(--outline);background:var(--card-2);position:relative;flex:none}
.tog:after{content:"";position:absolute;top:2px;right:2px;width:17px;height:17px;border-radius:50%;background:var(--ink-dim)}
.tog.on{background:var(--accent)}
.tog.on:after{right:auto;left:2px;background:var(--accent-ink)}
.hr{height:2px;background:var(--line);margin:2px 0}
.pill{font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;border:2px solid var(--outline);background:var(--card-2);white-space:nowrap}
.pill.ac{background:var(--accent);color:var(--accent-ink)}
.dyn{font-family:'Noto Music',serif;font-style:italic;font-weight:700;font-size:22px;line-height:1}
.bdg{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--outline);border-radius:10px;padding:3px 9px;font-weight:700;font-size:13px;background:var(--card)}
.bdg b{font-family:var(--display);font-weight:400;font-size:15px}
.meter{height:10px;border-radius:999px;border:2px solid var(--outline);background:var(--card-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.svgw{display:block;width:100%;direction:ltr}
.lst .it{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:2px solid var(--line)}
.lst .it:last-child{border-bottom:none}
.thumb{width:54px;height:38px;flex:none;border:2px solid var(--outline);border-radius:9px;background:var(--card-2);overflow:hidden}
.strip{display:flex;gap:2px;direction:ltr}
.strip i{width:9px;height:9px;border:1.5px solid var(--outline);border-radius:2px;background:var(--card)}
.strip i.d{background:var(--accent)}
.strip i.c{background:var(--now)}
.input{border:var(--stroke) solid var(--outline);border-radius:12px;padding:9px 12px;background:var(--card);font-size:14px;font-weight:500}
.dots{display:flex;gap:10px;justify-content:center;direction:ltr}
.dots i{width:16px;height:12px;border-radius:50%;transform:rotate(-20deg);border:2px solid var(--outline);background:var(--card)}
.dots i.on{background:var(--now)}
.dots i.done{background:var(--ink)}
.kv{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:2px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.ring{position:relative}
.pop{position:absolute;background:var(--card);border:var(--stroke) solid var(--outline);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:flex;gap:4px;z-index:2}
.grid12{display:grid;gap:3px;direction:ltr}
.grid12 .k{font-family:var(--display);font-size:14px;text-align:center}
.grid12 .r{font-size:11px;color:var(--ink-dim);font-weight:700;text-align:right;padding-right:4px;white-space:nowrap;direction:rtl}
.grid12 .c{height:22px;border:2px solid var(--line-strong);border-radius:6px;background:var(--card)}
.grid12 .c.d{background:var(--accent);border-color:var(--outline)}
.grid12 .c.p{background:var(--accent);border-color:var(--outline);position:relative}
.grid12 .c.p:after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--accent-ink)}
.grid12 .c.cur{background:var(--now);border-color:var(--outline);border-width:2.5px}
.lock{position:absolute;inset:0;background:#120a20;color:#fff;display:flex;flex-direction:column;align-items:center;padding-top:80px}
.toni{width:46px;height:56px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:14px;border-radius:4px;border:2px solid var(--outline);display:inline-block}
.cover{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:start}
@media (max-width:899px){.cover{grid-template-columns:1fr}}
.cover h2{font-family:var(--display);font-weight:400;font-size:52px;margin:6px 0 0;line-height:1}
.cover .lead{font-size:17px;line-height:1.6;color:var(--ink-soft)}
.flow{display:flex;flex-direction:column;gap:8px}
.flow .st{display:flex;gap:12px;align-items:center}
.flow .n{width:30px;height:24px;border-radius:50%;transform:rotate(-20deg);border:var(--stroke) solid var(--outline);background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:13px;flex:none}
.flow .n b{transform:rotate(20deg);font-weight:400}
.names td,.names th{padding:8px 10px;border-bottom:2px solid var(--line);text-align:right;font-size:14px;vertical-align:top}
.names th{font-size:12px;color:var(--ink-dim)}
.names tr.pick td{background:var(--card-2)}
</style>
</head>
<body>
<div class="bar">
  <h1>הדרן · Encore</h1>
  <span class="cnt" id="cnt"></span>
  <span class="sp"></span>
  <button class="vb" id="theme" aria-label="Theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg></button>
  <button class="vb" id="prev" aria-label="הקודם"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg><span class="t">הקודם</span></button>
  <button class="vb pr" id="next" aria-label="הבא"><span class="t">הבא</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
</div>
<div class="deck" id="deck"></div>

<script>
(function(){
/* ------------------------------------------------------------ icons */
const P={
 back:'<path d="M9 6l6 6-6 6"/>',close:'<path d="M6 6l12 12M18 6 6 18"/>',more:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
 play:'<path d="M8 5.5v13l11-6.5z" fill="currentColor"/>',pause:'<path d="M8 5v14M16 5v14"/>',star:'<path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8 6.8 19.5l1-5.8-4.2-4.1 5.8-.8z"/>',
 starf:'<path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8 6.8 19.5l1-5.8-4.2-4.1 5.8-.8z" fill="currentColor"/>',
 share:'<path d="M12 15V3M7 8l5-5 5 5M5 13v6h14v-6"/>',folder:'<path d="M3 6h6l2 2h10v11H3z"/>',search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/>',
 mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',keys:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 5v9M12 5v9M16 5v9M8 14v5M12 14v5M16 14v5"/>',
 loop:'<path d="M17 2l3 3-3 3M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3M20 13v2a4 4 0 0 1-4 4H4"/>',plus:'<path d="M12 5v14M5 12h14"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
 today:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',path:'<path d="M5 20c0-6 14-4 14-10S12 4 12 4"/><circle cx="12" cy="4" r="1.6"/><circle cx="5" cy="20" r="1.6"/>',
 practice:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',wave:'<path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 7v10M21 12h0"/>',
 people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.2A5 5 0 0 1 21.5 19"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 prev:'<path d="M6 5v14M19 5L9 12l10 7z" fill="currentColor"/>',next:'<path d="M18 5v14M5 5l10 7-10 7z" fill="currentColor"/>',speed:'<path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-6"/>',
 head:'<path d="M3 12c3 0 3-6 6-6s3 12 6 12 3-6 6-6"/>',swap:'<path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>',bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/>',flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',filter:'<path d="M4 5h16l-6 8v6l-4-2v-4z"/>',
 rec:'<circle cx="12" cy="12" r="7" fill="currentColor"/>',stop:'<rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
 send:'<path d="M3 11l18-8-8 18-2-8z"/>',note:'<ellipse cx="9" cy="17" rx="4" ry="3" transform="rotate(-20 9 17)" fill="currentColor"/><path d="M12.6 15.5V4l5 2.5"/>'
};
const I=(n,extra='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${P[n]}</svg>`;
// the Encore glyph: a note head between repeat signs

function staff(o){

   <div class="row" style="gap:16px;align-items:stretch;flex:1"><div class="col grow" style="gap:12px"><div class="cd col">${staff({w:600,h:140,sp:8.5,top:44,chords:CH_F})}<div class="row" style="gap:8px"><span class="bt sm">${I('play')}להשמיע</span><span class="bt sm">${I('mic')}הקליפ של היוצר</span><span class="grow"></span><span class="ch">${Q('200')}</span><span class="ch">כל 12</span><span class="ch">יד ימין</span></div></div><div class="cd col"><div class="t2">ההתקדמות שלך באתגר</div>${strip(6,6)}<div class="t3">6 סולמות ב־${Q('200')} · הבא ${B('A♭')}</div></div><div class="row" style="gap:10px"><span class="bt pr grow">לקבל את האתגר</span><span class="bt">בראבו</span><span class="bt">${I('send')}לנצח את הטמפו שלי</span></div></div>
   <div class="cd col" style="width:430px;gap:6px"><div class="row"><span class="t2 grow">הלוח</span><div class="seg" style="width:170px"><span class="on">חברים</span><span>כולם</span></div></div>${board(5)}<div class="tiny">דירוג: סולמות ביעד · טמפו נקי · דיוק. רק ניסיונות שנמדדו.</div></div></div>`,'קהילה','p/K7Q2MX9A')});

// 22 feed
S.push({title:'אתגרי הדרן: הגלריה',note:'דף סופי, לא פיד אינסופי: משפט השבוע, מחברים, עולים השבוע (לפי כמה “למדו את זה”, לא כמה ניגנו). מסננים לפי כלי, דרגה וסגנון. שום דבר לא מתנגן עד שנוגעים.',
 p:()=>phone(`<div class="row" style="gap:6px"><span class="ch on">פסנתר</span><span class="ch">דרגה 5–8</span><span class="ch">ביבופ</span><span class="ch">${B('ii–V')}</span></div>
   <div class="cd col" style="gap:6px"><div class="row"><span class="pill ac">משפט השבוע</span><span class="grow"></span><span class="tiny">נגמר בעוד 4 ימים</span></div>${roll({notes:TAKE,w:320,h:80,from:34,to:46,lo:58,hi:86,chords:['Dm7♭5','G7','Cm6']})}<div class="t2">ירידה מינורית על ${B('ii–V')}</div><div class="t3">${B('BluesOwl')} · דרגה 6 · 112 משתתפים</div></div>
   <div class="t2">מחברים</div>
   <div class="cd col" style="gap:0;padding:6px 12px"><div class="lst">${[['ריף פתיחה לבלוז ב־'+B('B♭'),'Noa.K · דרגה 4',4],['פתיחה מודאלית ב־'+B('D'),'Itai · דרגה 5',0]].map(([t,s,n])=>`<div class="it"><span class="thumb">${roll({w:54,h:38,from:4,to:16})}</span><div class="grow"><div class="t2">${t}</div><div class="t3">${s}</div></div>${strip(n,n)}</div>`).join('')}</div></div>
   <div class="t2">עולים השבוע</div>
   <div class="cd col" style="gap:0;padding:6px 12px"><div class="lst"><div class="it"><span class="thumb">${roll({w:54,h:38,from:0,to:10})}</span><div class="grow"><div class="t2">שרשרת עטיפות על ${B('Cmaj7')}</div><div class="t3">48 למדו את זה השבוע</div></div></div></div></div>`,{title:'אתגרי הדרן',sub:'קהילה',left:`<span class="ib">${I('search')}</span>`}),
 w:()=>wide(`${H2('אתגרי הדרן','קהילה · השבוע',`<span class="ch on">פסנתר</span><span class="ch">גיטרה</span><span class="ch">קול</span><span class="ch">דרגה 5–8</span><span class="ch">ביבופ</span><span class="ch">${B('ii–V')}</span><span class="ib">${I('search')}</span>`)}
   <div class="row" style="gap:16px;align-items:stretch;flex:1"><div class="cd col" style="width:430px;gap:8px"><div class="row"><span class="pill ac">משפט השבוע</span><span class="grow"></span><span class="tiny">נגמר בעוד 4 ימים</span></div>${roll({notes:TAKE,w:390,h:120,from:34,to:46,lo:58,hi:86,chords:['Dm7♭5','G7','Cm6']})}<div class="t1">ירידה מינורית על ${B('ii–V')}</div><div class="t3">${B('BluesOwl')} · דרגה 6 · 112 משתתפים · 41 הגיעו ליעד</div><span class="bt pr">לקבל את האתגר</span></div>
   <div class="col grow" style="gap:12px"><div class="t2">מחברים</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${[['ריף פתיחה לבלוז ב־'+B('B♭'),'Noa.K · דרגה 4',4],['פתיחה מודאלית ב־'+B('D'),'Itai · דרגה 5',0]].map(([t,s,n])=>`<div class="cd col" style="gap:6px">${roll({w:300,h:56,from:2,to:14})}<div class="t2">${t}</div><div class="row"><span class="t3 grow">${s}</span>${strip(n,n)}</div></div>`).join('')}</div><div class="t2">עולים השבוע</div><div class="cd col" style="gap:0"><div class="lst">${[['שרשרת עטיפות על '+B('Cmaj7'),'48 למדו את זה השבוע · דרגה 7'],['ליין בלוז עם תו כחול','31 למדו את זה · דרגה 3'],['ארפג׳ו מתהפך על '+B('Gm7'),'22 למדו את זה · דרגה 5']].map(([t,s],i)=>`<div class="it"><span class="big" style="font-size:18px;width:20px">${i+1}</span><div class="grow"><div class="t2">${t}</div><div class="t3">${s}</div></div><span class="ib sm">${I('play')}</span></div>`).join('')}</div></div><div class="tiny" style="text-align:center">זה הכול לשבוע הזה</div></div></div>`,'קהילה','community/encore')});

/* ------------------------------------------------------------ build + viewer */
const deck=document.getElementById('deck');
deck.innerHTML=S.map((s,i)=>s.cover?`<section class="slide" data-i="${i}">${s.html}</section>`:
 `<section class="slide" data-i="${i}"><div class="cap"><h2>${s.title}</h2><p>${s.note}</p></div><div class="stage"><div><div class="fit fp"><div class="inner">${s.p()}</div></div><div class="lbl">טלפון · <bdi dir="ltr">390×844</bdi></div></div><div><div class="fit fw"><div class="inner">${s.w()}</div></div><div class="lbl">מחשב · <bdi dir="ltr">1280×800</bdi></div></div></div></section>`).join('');
const slides=[...deck.querySelectorAll('.slide')];
let cur=0;try{cur=Math.min(slides.length-1,Math.max(0,parseInt(location.hash.slice(1))||0));}catch(e){}
function fit(){const vw=innerWidth,vh=innerHeight-56;const sl=slides[cur];const cap=sl.querySelector('.cap');const capH=cap?cap.offsetHeight+12:0;
  const fp=sl.querySelector('.fp'),fw=sl.querySelector('.fw');if(!fp)return;
  let sp,sw;
  if(vw>=900){const H=vh-capH-60;sp=Math.min(1,H/864);const pw=410*sp;const W=Math.min(vw,1700)-48-pw-28;sw=Math.min(W/1284,H/804);}
  else{sp=Math.min(1,(vw-32)/410);sw=(vw-32)/1284;}
  [[fp,410,864,sp],[fw,1284,804,sw]].forEach(([el,w,h,s])=>{el.style.width=w*s+'px';el.style.height=h*s+'px';el.firstElementChild.style.transform=`scale(${s})`;});}
function show(i){cur=(i+slides.length)%slides.length;slides.forEach((s,j)=>s.classList.toggle('on',j===cur));document.getElementById('cnt').textContent=`${cur+1} / ${slides.length} · ${S[cur].title}`;try{history.replaceState(null,'','#'+cur);}catch(e){}deck.scrollTop=0;fit();}
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('prev').onclick=()=>show(cur-1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key===' '||e.key==='PageDown'){e.preventDefault();show(cur+1);}else if(e.key==='ArrowRight'||e.key==='PageUp'){e.preventDefault();show(cur-1);}else if(e.key==='Home')show(0);else if(e.key==='End')show(slides.length-1);});
addEventListener('resize',fit);
document.getElementById('theme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';};
show(cur);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
})();
</script>
