<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1020" />
    <meta name="description" content="The 7th Sense — voice-first ear training: hear it, say it, sing it." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="The 7th Sense" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>The 7th Sense</title>
    <script>
      // The look (src/ui/look.ts) before the first paint: studio by default; ?look=classic (remembered) or a stored
      // tt.look = 'classic' keeps the previous look; ?look=studio clears that.
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('look');
          if (q === 'classic') localStorage.setItem('tt.look', 'classic');
          else if (q === 'studio') localStorage.removeItem('tt.look');
          if (localStorage.getItem('tt.look') !== 'classic') document.documentElement.setAttribute('data-look', 'studio');
        } catch (e) {
          if (!/[?&]look=classic\b/.test(location.search)) document.documentElement.setAttribute('data-look', 'studio');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
