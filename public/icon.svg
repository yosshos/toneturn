<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Ninth Sense</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#4A2A7A"/>
      <stop offset="1" stop-color="#1E1236"/>
    </linearGradient>
    <linearGradient id="nine" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFD66B"/>
      <stop offset="0.55" stop-color="#FFB04D"/>
      <stop offset="1" stop-color="#FF6A4D"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Sound waves coming in -->
  <path d="M108 134 A 130 130 0 0 0 108 278" fill="none" stroke="#4BE3B5" stroke-width="22" stroke-linecap="round" opacity="0.55"/>
  <path d="M156 166 A 80 80 0 0 0 156 246" fill="none" stroke="#4BE3B5" stroke-width="22" stroke-linecap="round"/>
  <!-- The 9: a ring (the ear's bowl) with a tail that curls like an ear lobe -->
  <ellipse cx="298" cy="206" rx="96" ry="94" fill="none" stroke="url(#nine)" stroke-width="58"/>
  <path d="M394 210 V 318 Q 394 426 282 432" fill="none" stroke="url(#nine)" stroke-width="58" stroke-linecap="round"/>
  <!-- A note head in the bowl -->
  <ellipse cx="298" cy="206" rx="34" ry="28" transform="rotate(-22 298 206)" fill="#4BE3B5"/>
</svg>
